- generic [ref=e2]: "# Saltwarp > Wear that earns its weather. ## Store - **Currency**: USD - **Location**: Oakland, CA, US - **Logo**: https://i0.wp.com/saltwarp.shop/wp-content/uploads/2026/05/saltwarp-og-default.png?fit=1200%2C630&#038;ssl=1 - **Support**: hello@saltwarp.shop ## Browse - **Shop archive**: https://saltwarp.shop/shop/?utm_medium=referral&utm_id=woo_llms - **Search**: `https://saltwarp.shop/?s={search_term}&post_type=product&utm_medium=referral&utm_id=woo_llms` — replace `{search_term}` with the buyer's query - **Sitemaps** (exhaustive URL lists for full-catalog enumeration): - https://saltwarp.shop/sitemap.xml ## Catalog Top categories by product count. This is a sample, not exhaustive: full enumeration via the sitemaps under Browse, or `POST /wp-json/wc/ucp/v1/catalog/search`. - [Accessories](https://saltwarp.shop/product-category/accessories/) (13 products) - [Tees](https://saltwarp.shop/product-category/tees/) (10 products) - [Hoodies](https://saltwarp.shop/product-category/hoodies/) (4 products) - [Shirts](https://saltwarp.shop/product-category/shirts/) (4 products) - [Capsule](https://saltwarp.shop/product-category/capsule/) (4 products) - [Outerwear](https://saltwarp.shop/product-category/outerwear/) (3 products) - [Knits](https://saltwarp.shop/product-category/knits/) (1 product) Specializes in: Accessories, Tees, Hoodies, Shirts, Capsule, Outerwear, Knits. ## Shipping & Returns - **Ships from**: US ## Structured data Product pages emit schema.org/Product JSON-LD with `BuyAction.urlTemplate` for the per-product cart link, plus `MerchantReturnPolicy`, `OfferShippingDetails`, brand, price, availability, SKU, and GTIN where set. The `BuyAction` URL is the canonical deterministic cart link: it routes correctly across simple, variable, bundle, and grouped product types. The homepage emits `OnlineBusiness` with `hasOfferCatalog` and `SearchAction`. ## For agents - **UCP manifest**: `https://saltwarp.shop/.well-known/ucp` — capability discovery (what the store supports) - **UCP API base**: `https://saltwarp.shop/wp-json/wc/ucp/v1` — REST root for search, lookup, checkout - **Checkout API**: `POST https://saltwarp.shop/wp-json/wc/ucp/v1/checkout-sessions` — server returns a `continue_url`; redirect the buyer there. Product-specific cart links are also available via JSON-LD `BuyAction.urlTemplate` on each product page (deterministic across product types). <a id=\"ucp-extension\"></a> ## Extension schema Machine-readable JSON Schema for the `com.woocommerce.ai_storefront` UCP extension: `https://saltwarp.shop/wp-json/wc/ucp/v1/extension/schema`"