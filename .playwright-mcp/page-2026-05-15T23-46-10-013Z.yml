- generic [ref=e2]: "{\"$schema\":\"https:\\/\\/json-schema.org\\/draft\\/2020-12\\/schema\",\"$id\":\"https:\\/\\/saltwarp.shop\\/wp-json\\/wc\\/ucp\\/v1\\/extension\\/schema\",\"title\":\"WooCommerce AI Storefront UCP Extension Contract\",\"description\":\"Schema for the `com.woocommerce.ai_storefront` extension contract. The top-level `config` property describes the merchant-extension configuration advertised in the UCP manifest at `capabilities[com.woocommerce.ai_storefront][0].config`. Starting 2.0.0, no response-level payloads are emitted under this extension \\u2014 rating data moved to core `product.rating` per the UCP 2026-04-08 product shape.\",\"type\":\"object\",\"properties\":{\"config\":{\"type\":\"object\",\"description\":\"Merchant-extension configuration advertised at `capabilities[com.woocommerce.ai_storefront][0].config` in the UCP manifest.\",\"properties\":{\"store_context\":{\"type\":\"object\",\"description\":\"Commerce conventions this store operates under \\u2014 agents pre-filter based on these before calling catalog\\/checkout.\",\"properties\":{\"currency\":{\"type\":\"string\",\"description\":\"ISO 4217 currency code. Catalog prices quote in this currency; agents unable to transact here should decline rather than misrepresent the amount.\",\"examples\":[\"USD\",\"EUR\",\"JPY\"]},\"locale\":{\"type\":\"string\",\"description\":\"BCP 47 locale tag for default customer-facing content language.\",\"examples\":[\"en-US\",\"fr-FR\",\"zh-Hant-HK\"]},\"country\":{\"type\":[\"string\",\"null\"],\"description\":\"ISO 3166-1 alpha-2 for the merchant base country. Nullable when the merchant has not configured a base country in WC settings.\"},\"prices_include_tax\":{\"type\":\"boolean\",\"description\":\"When true (EU-typical), catalog prices are tax-inclusive. When false (US-typical), tax is added at checkout. Agents rendering cart previews use this to decide whether to show a tax line.\"},\"shipping_enabled\":{\"type\":\"boolean\",\"description\":\"When true, the store collects shipping addresses. When false, it is digital-only \\u2014 agents should skip address-collection prompts.\"}}}}},\"accepted_request_inputs\":{\"type\":\"object\",\"description\":\"Documents the extension-side request-input surface on `POST \\/catalog\\/search` and `POST \\/catalog\\/lookup` \\u2014 not a full enumeration of every accepted field. Covers: (a) UCP-spec-standard objects this implementation explicitly accepts and acts on (`context`, `signals`), and (b) merchant-specific extensions (`custom_filters`). Spec-standard fields like `query`, `filters.price`, `filters.categories`, `pagination`, `sort`, and `ids` are documented by the UCP core spec itself and are not repeated here. The `custom_filters` sub-tree exists per the UCP spec hint that merchants \\\"MAY support additional custom filters via additionalProperties\\\".\",\"properties\":{\"context\":{\"type\":\"object\",\"description\":\"Spec-standard `context` object is accepted. Currently honored field: `context.currency` \\u2014 when set and matching store currency, `filters.price` is applied; when mismatched, the price filter is dropped and a `currency_conversion_unsupported` warning is emitted (we don't carry FX rates). Other `context` fields (`address_country`, `address_region`, `postal_code`) are accepted but not yet acted upon; agents MAY send them today for forward compatibility.\"},\"signals\":{\"type\":\"object\",\"description\":\"Spec-standard `signals` object is accepted and logged for observability. No values are used for decisions at this time; the plugin complies with the spec's \\\"MUST NOT treat buyer claims as signals\\\" rule by not acting on any signal. Known-valuable future wiring: `dev.ucp.buyer_ip` for per-end-buyer rate limiting (currently we rate-limit by request IP, which conflates agent-platform traffic).\"},\"custom_filters\":{\"type\":\"object\",\"description\":\"Custom filters via `additionalProperties` \\u2014 accepted on `filters{}` in `\\/catalog\\/search` only. (`\\/catalog\\/lookup` reads only `ids` + `signals`; filters are ignored there because lookup resolves by explicit ID.) Unresolvable values on search emit `*_not_found` advisory warnings with JSONPath.\",\"properties\":{\"brand\":{\"type\":\"array\",\"description\":\"Array of brand names or slugs. Resolves against the native WC 9.5+ `product_brand` taxonomy. Multiple values OR together.\",\"items\":{\"type\":\"string\"}},\"tags\":{\"type\":\"array\",\"description\":\"Array of tag names or slugs. Resolves against `product_tag`. Multiple values OR together.\",\"items\":{\"type\":\"string\"}},\"in_stock\":{\"type\":\"boolean\",\"description\":\"When true, restrict results to products currently in stock.\"},\"featured\":{\"type\":\"boolean\",\"description\":\"When true, restrict to merchant-flagged featured products.\"},\"min_rating\":{\"type\":\"integer\",\"description\":\"Integer 1-5; restrict to products with average rating \\u2265 this value.\",\"minimum\":1,\"maximum\":5},\"on_sale\":{\"type\":\"boolean\",\"description\":\"When true, restrict to products with an active sale price.\"},\"attributes\":{\"type\":\"object\",\"description\":\"Keyed map of attribute slug \\u2192 array of values (e.g. `{\\\"color\\\": [\\\"red\\\", \\\"blue\\\"]}`). Resolves against WC `pa_*` taxonomies; `pa_` prefix is auto-added if missing. Unresolvable attribute taxonomies emit `attribute_not_found` warnings with JSONPath.\",\"additionalProperties\":{\"type\":\"array\",\"items\":{\"type\":\"string\"}}}}}}}}}"