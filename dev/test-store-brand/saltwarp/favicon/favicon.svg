<!--
  Saltwarp standalone mark — monogram construction.
  Letter S extracted from Inter 28pt SemiBold (SIL OFL 1.1),
  centered inside a rounded-square frame.

  System coherence: the wordmark and mark share the same letter S
  (same weight, same optical-size cut), so the brand reads as one
  family across all touchpoints.

  Frame: 56×56 rounded square, stroke 4, radius 8, centered with 4px inset.
  S: scaled to occupy ~70% of inner area height (34 of 48 units).
-->
