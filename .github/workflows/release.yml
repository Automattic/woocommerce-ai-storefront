name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # Needed to create releases and upload assets.

jobs:
  build-and-release:
    name: Build distribution zip
    runs-on: ubuntu-latest
    env:
      # Git tags come from a protected surface (pushes require write
      # access to the repo), but we still pass the value through an
      # env var rather than expression-interpolating it into `run:`
      # scripts. This is the recommended pattern — see
      # https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Derive the version from the tag (e.g. `v1.1.0` -> `1.1.0`) and
      # compare against the plugin header. Mismatches mean someone
      # tagged without bumping the header — fail fast rather than
      # ship an inconsistent artifact.
      - name: Verify plugin version matches tag
        run: |
          TAG_VERSION="${TAG#v}"
          HEADER_VERSION=$(grep -E '^[[:space:]]*\*[[:space:]]*Version:' woocommerce-ai-storefront.php | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          CONST_VERSION=$(grep -E "define\(\s*'WC_AI_STOREFRONT_VERSION'" woocommerce-ai-storefront.php | sed -E "s/.*'WC_AI_STOREFRONT_VERSION',\s*'([^']+)'.*/\1/")

          echo "Tag: $TAG_VERSION"
          echo "Plugin header: $HEADER_VERSION"
          echo "Version constant: $CONST_VERSION"

          if [ "$TAG_VERSION" != "$HEADER_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match plugin header ($HEADER_VERSION). Bump the plugin header before tagging."
            exit 1
          fi

          if [ "$TAG_VERSION" != "$CONST_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match WC_AI_STOREFRONT_VERSION constant ($CONST_VERSION)."
            exit 1
          fi

      # The plugin's runtime autoloader is includes/autoload.php (committed
      # to the repo). No production Composer packages ship to merchants.
      # This step installs dev tools only, specifically for make-pot below.
      - name: Install Composer dependencies (dev tools only, for make-pot)
        run: composer install --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend bundle
        run: npm run build

      # Regenerate the translation template from source so translators
      # picking up the released zip see fresh strings. Committed .pot
      # may have drifted between the last regen and the release tag.
      - name: Generate .pot translation template
        run: ./bin/make-pot.sh

      # Stage the release into a versioned directory. The directory
      # name determines the root path inside the zip (WP plugin zips
      # extract into wp-content/plugins/<dir-name>/), so this must
      # match the slug merchants see in their Plugins screen.
      #
      # All directory excludes are anchored with a leading slash so
      # they match ONLY the project-root copy, not any nested directory
      # of the same name. The `vendor/` anchor is load-bearing:
      # without it, rsync's gitignore-style pattern stripped the
      # bundled `includes/lib/plugin-update-checker/vendor/` directory,
      # which ships `PucReadmeParser.php`. Missing that file fataled
      # at update-check time:
      #   Class "PucReadmeParser" not found in Vcs/Api.php:139
      # PUC fetches the new release's readme.txt and constructs a
      # parser, which fails when the parser class never loaded.
      # v0.8.0–v0.8.2 shipped with the broken exclude; v0.8.3+
      # reinstates the bundled parser.
      #
      # The plugin's runtime autoloader is includes/autoload.php
      # (committed, no Composer required at runtime). Dev tools
      # installed above are still excluded — they live in the
      # project-root vendor/ which the anchored pattern catches.
      - name: Stage release files
        run: |
          mkdir -p release-staging
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.claude/' \
            --exclude='/.tools/' \
            --exclude='/node_modules/' \
            --exclude='/vendor/' \
            --exclude='/client/' \
            --exclude='/tests/' \
            --exclude='/bin/' \
            --exclude='/scripts/' \
            --exclude='/dev/' \
            --exclude='/release-staging/' \
            --exclude='*.log' \
            --exclude='/.phpunit.cache/' \
            --exclude='.phpunit.result.cache' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='phpcs.xml.dist' \
            --exclude='phpstan.neon.dist' \
            --exclude='phpstan-bootstrap.php' \
            --exclude='phpunit.xml.dist' \
            --exclude='webpack.config.js' \
            --exclude='jest.config.js' \
            --exclude='AGENTS.md' \
            --exclude='README.md' \
            --exclude='.gitignore' \
            --exclude='.editorconfig' \
            --exclude='.npmrc' \
            ./ release-staging/woocommerce-ai-storefront/

      - name: Create zip
        run: |
          ZIP_NAME="woocommerce-ai-storefront-${TAG}.zip"
          cd release-staging
          zip -r "../${ZIP_NAME}" woocommerce-ai-storefront
          cd ..
          ls -la "${ZIP_NAME}"
          unzip -l "${ZIP_NAME}" | head -30
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      # Extract the version block for $TAG from CHANGELOG.md so the
      # Release body matches the long-form headlines + sub-bullets
      # we curate by hand. CHANGELOG.md is the source of truth for
      # release notes; release-drafter used to maintain a parallel
      # draft from PR labels but the two always drifted (different
      # formatting, different scope decisions, MINOR/PATCH mismatches
      # when the drafter predicted PATCH for a MINOR cut). Retired
      # the drafter in favor of this single-source extraction.
      #
      # The awk pattern walks until it hits the matching `## [X.Y.Z]`
      # header for the tag's version (stripping the `v` prefix), then
      # prints every line until it hits the next `---` divider that
      # separates versioned blocks. The header line and the trailing
      # `---` are NOT printed — `next` skips the header so the body
      # starts at the section's first content line.
      #
      # `$TAG` flows in via env: (set at the job level) — safe pattern
      # per the GitHub Actions injection guide. Same approach the
      # version-verification step above uses.
      #
      # Fail-fast if the block is empty: shipping a Release with no
      # notes is worse than blocking the workflow until the CHANGELOG
      # gets a proper entry.
      - name: Extract release notes from CHANGELOG.md
        run: |
          TAG_VERSION="${TAG#v}"
          awk -v ver="$TAG_VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            /^---$/ && flag { exit }
            flag
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md block found for version $TAG_VERSION. Add a '## [$TAG_VERSION] – YYYY-MM-DD' section before tagging."
            exit 1
          fi
          echo "Extracted $(wc -l < release-notes.md) lines of release notes."
          head -5 release-notes.md

      # Create the Release and attach the zip in one step.
      #
      # We deliberately do NOT set `prerelease: true` even though the
      # plugin is still in its 0.x lifecycle. GitHub's "Pre-release"
      # flag carries a specific semantic — "not for production use" —
      # that contradicts what readme.txt's Description tells merchants
      # under the Beta framing: "Production use is supported." The
      # plugin signals its Beta lifecycle status through four
      # in-product surfaces instead (PageHeader pill, HelpMenu Version
      # line, readme Description, USER-GUIDE intro) — those are the
      # right place for the soft "shape may still change" signal,
      # because they reach the merchant where they're actually using
      # the plugin. GitHub's hard pre-release flag would also strip
      # the "Latest" badge from each new release in favor of the most
      # recent non-prerelease, which during the 0.x window meant the
      # Releases page accidentally promoted older versions to merchants
      # who landed there directly.
      #
      # `make_latest: legacy` keeps the "Latest" badge tied to
      # chronological order rather than the semver-highest default.
      # Important for 0.x: if we ever cut a hotfix off an older tag
      # (e.g. v0.14.3 after v0.15.0 has shipped), we don't want the
      # hotfix demoting v0.15.0 from "Latest." Chronological wins.
      #
      # softprops/action-gh-release@v2 creates the Release if it
      # doesn't exist (the common path now that release-drafter is
      # retired) and updates it idempotently on workflow re-runs.
      - name: Create release and upload artifact
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          body_path: release-notes.md
          make_latest: legacy
